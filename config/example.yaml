# Frankenstein Arterial Monitor — 配置示例
# 复制为 config/local.yaml 后填写真实路径。local.yaml 不提交。
# 这里只放路径与超参，不放密钥与真实数据。

# 两个开源仓库的本地路径（clone 到本仓库旁边；只引用，不复制代码）
paths:
  anpr_repo: ../availability-aware-anpr-forecasting  # ANPR 预测（MIT）
  filter_repo: ../wake-up-overshoot                  # 唤醒滤波（Apache-2.0）

# 数据目录（ANPR 输入路径由开源仓库的 study_config.yaml 指定；BINANCE_RAW 可用环境变量覆盖）
data:
  anpr_config: ../availability-aware-anpr-forecasting/study_config.yaml  # plate1_path / plate2_path
  binance_raw: ../data/raw                # Binance aggTrades zip（自行下载）

# ANPR 预测
anpr:
  period_seconds: 300                      # 5 分钟周期，严格按边界切分
  coverage_target: 0.90                    # 门控发布覆盖率目标
  # 模型选择在开源仓库冻结；服务 KPI 见 frozen_evaluation.py

# 唤醒滤波
filter:
  bin_widths_ms: [10, 50, 250, 1000]      # 分箱宽度 Δ
  frozen_params: ../wake-up-overshoot/experiment/frozen_params.json
  theory_regions: ../wake-up-overshoot/experiment/theory_regions.json

# 编排
orchestrator:
  log_dir: outputs/logs
  publish_on_fallback: false               # 回退时只记日志，不发布区间
